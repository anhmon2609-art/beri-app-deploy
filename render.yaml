databases:
  - name: beri-db
    plan: free
    region: singapore

services:
  - type: web
    name: viec-nha-cua-be
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: DATABASE_URL
        fromDatabase:
          name: beri-db
          property: connectionString
      - key: PGSSL
        value: "false"
